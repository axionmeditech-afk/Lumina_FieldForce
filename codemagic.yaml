workflows:
  ios-ipa:
    name: Lumina FieldForce iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Lumina_fieldforce
    environment:
      groups:
        - API KEYS
      ios_signing:
        distribution_type: app_store # Change to ad_hoc if you want a directly installable device build.
        bundle_identifier: com.luminafieldforce
      vars:
        BUNDLE_ID: "com.luminafieldforce"
        APP_STORE_APP_ID: "6761368486"
      node: 22.14.0
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install JavaScript dependencies
        script: |
          npm ci
      - name: Generate iOS native project from Expo
        script: |
          npx expo prebuild --platform ios --non-interactive
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update
      - name: Build signed IPA
        script: |
          set -euo pipefail

          IOS_WORKSPACE="$(find "$CM_BUILD_DIR/ios" -maxdepth 1 -name "*.xcworkspace" -print -quit)"
          IOS_PROJECT="$(find "$CM_BUILD_DIR/ios" -maxdepth 1 -name "*.xcodeproj" -print -quit)"
          APP_SCHEME="$(basename "$IOS_PROJECT" .xcodeproj)"
          if [ -z "$IOS_WORKSPACE" ]; then
            echo "No Xcode workspace found under ios/"
            exit 1
          fi
          if [ -z "$IOS_PROJECT" ]; then
            echo "No Xcode project found under ios/"
            exit 1
          fi

          IOS_SCHEME="$APP_SCHEME"

          echo "Using workspace: $IOS_WORKSPACE"
          echo "Using project: $IOS_PROJECT"
          echo "Preferred app scheme: $APP_SCHEME"
          echo "Using scheme: $IOS_SCHEME"

          xcode-project use-profiles --project "$IOS_PROJECT"

          xcode-project build-ipa \
            --workspace "$IOS_WORKSPACE" \
            --scheme "$IOS_SCHEME"
      - name: Publish to App Store Connect manually
        script: |
          set -e
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          
          echo "Attempting upload with app-store-connect CLI and Explicit Apple ID..."
          if app-store-connect publish --path "$IPA_PATH" --apple-id "6761368486"; then
            echo "Successfully uploaded using app-store-connect CLI!"
            exit 0
          fi
          
          echo "app-store-connect CLI failed. Falling back to explicit xcrun altool..."
          mkdir -p ~/.appstoreconnect/private_keys
          
          # Extremely robust way to format the private key to valid PEM format
          KEY_BODY=$(echo "$APP_STORE_CONNECT_PRIVATE_KEY" | sed -e 's/-----BEGIN PRIVATE KEY-----//g' -e 's/-----END PRIVATE KEY-----//g' -e 's/\\n//g' | tr -d ' \n\r')
          FORMATTED_BODY=$(echo "$KEY_BODY" | fold -w 64)
          
          P8_PATH=~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8
          echo "-----BEGIN PRIVATE KEY-----" > "$P8_PATH"
          echo "$FORMATTED_BODY" >> "$P8_PATH"
          echo "-----END PRIVATE KEY-----" >> "$P8_PATH"
          chmod 600 "$P8_PATH"
          
          echo "Uploading $IPA_PATH using Explicit Apple ID 6761368486..."
          xcrun altool --upload-app -f "$IPA_PATH" -t ios --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" --app-apple-id "6761368486"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
